# CI: run the test suite against a temporary PostgreSQL on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Temporary database, thrown away after the run
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cz_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cz_data"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cz_data
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
