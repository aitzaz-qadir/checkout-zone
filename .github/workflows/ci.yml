# CI/CD: run tests on every push and pull request; on main, build, push to ECR and deploy to EC2
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Temporary database, thrown away after the run
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cz_data
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cz_data"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cz_data
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      id-token: write
      contents: read
    env:
      ECR_IMAGE: 851725432663.dkr.ecr.ca-central-1.amazonaws.com/checkout-zone
      INSTANCE_ID: i-04076e84174f1b235

    steps:
      - uses: actions/checkout@v5

      # Exchange GitHub's OIDC token for temporary AWS credentials
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::851725432663:role/github-actions-checkout-zone
          aws-region: ca-central-1

      - uses: aws-actions/amazon-ecr-login@v2

      # Build once, tag with the commit ID and "latest", push both
      - name: Build and push image
        run: |
          docker build -t "$ECR_IMAGE:$GITHUB_SHA" -t "$ECR_IMAGE:latest" .
          docker push --all-tags "$ECR_IMAGE"

      # Run the deploy script on the server via SSM and wait for the result
      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters commands="cd /home/ubuntu/checkout-zone && sudo -u ubuntu git pull --ff-only && bash infra/deploy.sh $GITHUB_SHA" \
            --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          test "$STATUS" = "Success"
