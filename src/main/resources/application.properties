# Application name
spring.application.name=CheckoutZone

# Default to dev profile locally; the server sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Database configuration (env vars, with local defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cz_data}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional bootstrap admin (created only when both are set)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
